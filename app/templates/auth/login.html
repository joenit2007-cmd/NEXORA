<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — NEXORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/nexora.css') }}" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card fade-in">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/nexora-logo.svg') }}" alt="NEXORA" width="52" height="52" class="mb-2">
        <h1 class="h4 fw-bold mb-1" style="letter-spacing:0.14em;color:#00d4ff;">NEXORA</h1>
        <div class="text-secondary small text-uppercase" style="letter-spacing:0.14em;">DETECT. ANALYZE. SECURE.</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 px-3 small" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username or Email</label>
          <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="analyst or analyst@org.local">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" name="remember">
            <label class="form-check-label small text-secondary" for="remember">Keep session active</label>
          </div>
          <span class="badge-soc severity-info"><i class="bi bi-lock-fill"></i> CSRF &amp; PBKDF2</span>
        </div>
        <button type="submit" class="btn btn-nexora w-100 py-2">
          <i class="bi bi-shield-lock me-1"></i> Sign In to SOC
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary-subtle small text-secondary">
        Need a NEXORA operator account?
        <a href="{{ url_for('auth.register') }}" class="text-info text-decoration-none fw-semibold">Register here</a>
      </div>
    </div>
  </div>
</body>
</html>
