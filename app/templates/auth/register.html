<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account — NEXORA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/nexora.css') }}" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card fade-in">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/nexora-logo.svg') }}" alt="NEXORA" width="48" height="48" class="mb-2">
        <h1 class="h4 fw-bold mb-1" style="letter-spacing:0.12em;color:#00d4ff;">NEXORA REGISTRATION</h1>
        <div class="text-secondary small">Cybersecurity Threat Monitoring &amp; Assessment Platform</div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 px-3 small" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required minlength="3" maxlength="32" placeholder="soc_analyst">
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="analyst@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="8" placeholder="Min 8 chars, letters + numbers">
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Repeat password">
        </div>
        <button type="submit" class="btn btn-nexora w-100 py-2">
          <i class="bi bi-person-plus me-1"></i> Create Operator Account
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top border-secondary-subtle small text-secondary">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="text-info text-decoration-none fw-semibold">Sign in</a>
      </div>
    </div>
  </div>
</body>
</html>
